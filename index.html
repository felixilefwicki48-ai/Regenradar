<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regenradar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#667; --card:#f2f4f7; --acc:#1a73e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8eaed; --muted:#9aa0a6; --card:#22262b; --acc:#6ea8ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: flex; flex-direction: column; }
  header { display: flex; gap: 6px; padding: 8px; background: var(--card); }
  header input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px;
                 border: 1px solid #8884; background: var(--bg); color: var(--fg); font-size: 16px; }
  button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--acc);
           color: #fff; font-size: 16px; cursor: pointer; }
  #map { flex: 1; min-height: 0; }
  footer { padding: 8px 12px 12px; background: var(--card); }
  .row { display: flex; align-items: center; gap: 10px; }
  #slider { flex: 1; }
  #time { font-weight: 600; min-width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
  #status { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 34px; height: 8px; border-radius: 4px;
              background: linear-gradient(90deg,#9ee,#4ae,#25c,#2a2,#fd0,#f80,#e22,#a0a); }
  #results { position: absolute; z-index: 1000; top: 52px; left: 8px; right: 8px;
             background: var(--card); border-radius: 8px; display: none; overflow: hidden; }
  #results div { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #8883; }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Ort oder PLZ suchen …" enterkeyhint="search">
  <button id="go">Suchen</button>
  <button id="loc" title="Mein Standort">📍</button>
</header>
<div id="results"></div>
<div id="map"></div>
<footer>
  <div class="row">
    <button id="play">⏸</button>
    <input id="slider" type="range" min="0" max="0" value="0">
    <span id="time">–</span>
  </div>
  <div id="status">Lade Radar …</div>
  <div class="legend">schwach <i></i> stark · Radar: Deutscher Wetterdienst</div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const WMS = 'https://maps.dwd.de/geoserver/dwd/wms';
// Kandidaten: Radar mit Vorhersage zuerst, reines Messradar nur als Rückfall
const CANDIDATES = ['dwd:Radar_rv_product_1x1km_ger', 'dwd:Radar_wn-product_1x1km_ger', 'dwd:Niederschlagsradar'];
const STEP_MIN = 15;      // Schrittweite
const BACK_MIN = 60;      // 1 Stunde zurück, dazu bis zu 2 Stunden Prognose
const OPACITY = 0.75;

const map = L.map('map', { zoomControl: true }).setView([54.09, 12.13], 8); // Rostock
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12, attribution: '© OpenStreetMap'
}).addTo(map);
let marker = L.marker([54.09, 12.13]).addTo(map);

let frames = [];   // { t, layer }
let idx = 0, timer = null, playing = true;

const $ = id => document.getElementById(id);
const fmt = ms => new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

function parseDim(text) {
  const out = [];
  text.split(',').forEach(part => {
    part = part.trim();
    if (!part) return;
    const p = part.split('/');
    if (p.length >= 2) {
      const a = Date.parse(p[0]), b = Date.parse(p[1]);
      const m = /PT(\d+)M/.exec(p[2] || '');
      const step = (m ? +m[1] : 5) * 60000;
      for (let t = a; t <= b; t += step) out.push(t);
    } else out.push(Date.parse(part));
  });
  return out.filter(Number.isFinite).sort((x, y) => x - y);
}

async function getTimes() {
  const r = await fetch(WMS + '?service=WMS&version=1.3.0&request=GetCapabilities');
  const doc = new DOMParser().parseFromString(await r.text(), 'text/xml');
  const layers = Array.from(doc.getElementsByTagName('Layer'));
  const nameOf = l => { const n = l.querySelector(':scope > Name'); return n ? n.textContent : ''; };
  // Name kann mit oder ohne Präfix "dwd:" erscheinen
  const strip = s => s.replace(/^dwd:/, '').toLowerCase();
  let best = null;
  CANDIDATES.forEach(c => {
    const l = layers.find(x => strip(nameOf(x)) === strip(c));
    if (!l) return;
    const dim = l.querySelector('Dimension[name="time"]') || l.querySelector('Dimension');
    if (!dim) return;
    const times = parseDim(dim.textContent);
    if (!times.length) return;
    // Ebene mit dem spätesten Zeitpunkt (= weiteste Prognose) gewinnt
    if (!best || times[times.length - 1] > best.times[best.times.length - 1] + 60000) {
      best = { name: nameOf(l), times };
    }
  });
  if (!best) throw new Error('keine Radar-Ebene gefunden');
  return best;
}

function clearFrames() {
  frames.forEach(f => map.removeLayer(f.layer));
  frames = [];
}

async function loadRadar() {
  $('status').textContent = 'Lade Radar …';
  try {
    const { name, times } = await getTimes();
    const end = times[times.length - 1];
    const start = times[0];
    const wanted = [];
    const from = Date.now() - BACK_MIN * 60000;
    for (let t = end; t >= start && t >= from; t -= STEP_MIN * 60000) wanted.unshift(t);
    clearFrames();
    wanted.forEach(t => {
      const layer = L.tileLayer.wms(WMS, {
        layers: name, format: 'image/png', transparent: true,
        time: new Date(t).toISOString().replace('.000Z', 'Z'),
        opacity: 0, attribution: 'Radar © DWD'
      }).addTo(map);
      frames.push({ t, layer });
    });
    const s = $('slider');
    s.max = frames.length - 1;
    idx = 0;
    frames.forEach((f, k) => { if (f.t <= Date.now() + 150000) idx = k; }); // "jetzt"
    show(idx);
    const hasFc = end > Date.now() + 150000;
    $('status').textContent = (hasFc ? 'Prognose bis ' + fmt(end) + ' Uhr' : 'Nur Messdaten bis ' + fmt(end) + ' Uhr (keine Prognose verfügbar)')
      + ' · ' + STEP_MIN + '-Minuten-Schritte';
    if (playing) start_();
  } catch (e) {
    $('status').textContent = 'Radar konnte nicht geladen werden (' + e.message + ').';
  }
}

function show(i) {
  frames.forEach((f, k) => f.layer.setOpacity(k === i ? OPACITY : 0));
  idx = i;
  $('slider').value = i;
  const f = frames[i];
  if (!f) return;
  const future = f.t > Date.now() + 150000;
  $('time').textContent = fmt(f.t) + ' Uhr' + (future ? ' (Prognose)' : '');
}

function start_() {
  stop_();
  playing = true; $('play').textContent = '⏸';
  timer = setInterval(() => show((idx + 1) % frames.length), 800);
}
function stop_() {
  clearInterval(timer); timer = null;
  playing = false; $('play').textContent = '▶';
}

$('play').onclick = () => playing ? stop_() : start_();
$('slider').oninput = e => { stop_(); show(+e.target.value); };

function setPlace(lat, lon, zoom) {
  marker.setLatLng([lat, lon]);
  map.setView([lat, lon], zoom || 9);
}

async function search() {
  const q = $('q').value.trim();
  if (!q) return;
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' +
    encodeURIComponent(q) + '&count=5&language=de&format=json');
  const j = await r.json();
  const box = $('results');
  box.innerHTML = '';
  if (!j.results || !j.results.length) {
    box.innerHTML = '<div>Nichts gefunden</div>';
  } else {
    j.results.forEach(p => {
      const d = document.createElement('div');
      d.textContent = [p.name, p.admin1, p.country].filter(Boolean).join(', ');
      d.onclick = () => { setPlace(p.latitude, p.longitude); box.style.display = 'none'; };
      box.appendChild(d);
    });
  }
  box.style.display = 'block';
}
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('loc').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => setPlace(p.coords.latitude, p.coords.longitude),
    () => { $('status').textContent = 'Standort nicht verfügbar.'; });
};

loadRadar();
setInterval(loadRadar, 5 * 60000); // alle 5 Minuten neu laden
</script>
</body>
</html>
